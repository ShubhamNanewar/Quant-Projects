name: Crypto venue and lending research
on:
  push:
    paths:
      - 'digital-assets/venue-and-lending-risk/**'
      - '.github/workflows/crypto-risk.yml'
  pull_request:
    paths:
      - 'digital-assets/venue-and-lending-risk/**'
      - '.github/workflows/crypto-risk.yml'
permissions:
  contents: read
jobs:
  archived-data-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-assets/venue-and-lending-risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m desk_risk.analyze
